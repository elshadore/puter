[settings]
screenchange-reload = false
pseudo-transparency = false

[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/puter]
monitor = HDMI-1
width = 100%
height = 24
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0 
border-size = 0
border-color = #00000000
padding = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = IosevkaNerdFontMono
fixed-center = true
modules-left = exwm-workspace
modules-center = xwindow
modules-right = cpu memory pulseaudio date systray
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/exwm-workspace]
type = custom/ipc
hook-0 = emacsclient -e "(puter/polybar-exwm-workspace)" | sed -e 's/^"//' -e 's/"$//'
initial = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/systray]
type = internal/tray
format-margin = 0pt
tray-spacing = 16pt

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 1
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date= %A %d-%m-%Y %H:%M:%S
date-alt = %A d%-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
