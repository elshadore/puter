[colors]
background = #212437
background-alt = #151726
foreground = #efece2
green = #a8ff60
blue = #96cbfe
pink = #f870f6
borders = #596066
disabled = #7dadbe

[bar/puter]
; wm-restack = i3
monitor = HDMI-1
width = 100%
height = 22pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 2pt
border-color= ${colors.background-alt}
padding-left = 0
padding-right = 0
module-margin = 3pt
separator = |
separator-foreground = ${colors.borders}
; font-0 = TerminessNerdFontMono
font-0 = IosevkaNerdFontMono
modules-left = xworkspaces
modules-center = xwindow
modules-right = cpu memory pulseaudio date systray
cursor-click = pointer
cursor-scroll = ns-resize

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.pink}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.pink}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.blue}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1
date= %A %d-%m-%Y %H:%M:%S
date-alt = %A d%-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.green}

[settings]
screenchange-reload = true
pseudo-transparency = true