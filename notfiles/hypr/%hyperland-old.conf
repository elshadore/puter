monitor=,preferred,auto,1

$terminal = kitty
$fileManager = nemo

env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32

exec-once = nm-applet
exec-once = dunst
exec-once = hyprpaper
exec-once = waybar
exec-once = wl-paste --watch cliphist store

general {
    gaps_in = 3
    gaps_out = 5

    border_size = 1

    col.active_border = rgba(f43fb6ff)
    col.inactive_border = rgba(151726ff)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 80
    repeat_delay = 200

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

workspace = 1, name:0
workspace = 2, name:1
workspace = 3, name:2
workspace = 4, name:3
workspace = 5, name:4
workspace = 6, name:5
workspace = 7, name:6
workspace = 8, name:7
workspace = 9, name:8
workspace = 10, name:9

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager

bind = $mainMod, Space, togglefloating,
bind = $mainMod, SemiColon, exec, puter-menu
bind = $mainMod, Apostrophe, exec, puter-menu emoji
bind = $mainMod, Period, exec, puter-menu clipboard
bind = $mainMod, Comma, exec, puter-menu window

bind = $mainMod, Slash, exec, dunstctl close
bind = $mainMod SHIFT, Slash, exec, dunstctl close-all

# bind = $mainMod, N, exec, hyprhack-cycle next
# bind = $mainMod, P, exec, hyprhack-cycle prev

bind = $mainMod, N, cyclenext
bind = $mainMod, P, cyclenext, prev

# bind = $mainMod, T, exec, hyprhack-workspace dwindle
# bind = $mainMod, M, exec, hyprhack-workspace monocle

bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0

bind = $mainMod, I, exec, puter-eyedropper

bind = $mainMod, print, exec, puter-screenshot

bind = $mainMod SHIFT, print, exec, puter-screenshot -full

bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, l, swapwindow, r

bind = $mainMod, Grave, workspace, 1
bind = $mainMod, 1, workspace, 2
bind = $mainMod, 2, workspace, 3
bind = $mainMod, 3, workspace, 4
bind = $mainMod, 4, workspace, 5
bind = $mainMod, 5, workspace, 6
bind = $mainMod, 6, workspace, 7
bind = $mainMod, 7, workspace, 8
bind = $mainMod, 8, workspace, 9
bind = $mainMod, 9, workspace, 10

bind = $mainMod SHIFT, Grave, movetoworkspace, 1
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Graphics Tablet
device {
    name = ugtablet-10-inch-pentablet
    output = HDMI-A-1
}

# Fixing Rofi
layerrule {
    name = nofadepls
    no_anim = on
    match:namespace = rofi
}

# Fixing Runelite
windowrule {
    name = runelite-tooltips
    match:class = ^(net-runelite-client-RuneLite)$
    match:title = ^win(.*)$
    no_initial_focus = true
}

# Initializing Workspaces
workspace=10, monitor:HDMI-A-2
workspace=2, monitor:HDMI-A-1
workspace=1, monitor:HDMI-A-1
exec-once = [workspace 1 silent] emacs
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 10 silent] kitty -e btop